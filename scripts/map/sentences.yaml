# Sentences for the hero embedding map (CLAUDE.md §6).
# Written only from the facts in CLAUDE.md §5. Each one is embedded with
# all-MiniLM-L6-v2 and projected to 3D with PCA by build_map.py.
#
# cluster: rag | evals | llm-apps | android | infra | testing | dsa
#   (the tag only sets the dot's color; position comes from the embedding)
# project: id of the panel the caption links to (optional)
#   yt-lecture-rag | hiremeai | mealtime | dsa-tracker | earlier-work

sentences:
  # ── rag ──────────────────────────────────────────────────────────
  - { cluster: rag, project: yt-lecture-rag, text: "YT Lecture RAG searches 126 YouTube DSA lectures and jumps to the second where a topic is explained." }
  - { cluster: rag, project: yt-lecture-rag, text: "Lecture transcripts are chunked into 75-second windows with 15 seconds of overlap." }
  - { cluster: rag, project: yt-lecture-rag, text: "The lecture index holds 2,933 transcript chunks from about 68 hours of video." }
  - { cluster: rag, project: yt-lecture-rag, text: "Transcript chunks are embedded with all-MiniLM-L6-v2 and stored in a local Qdrant collection." }
  - { cluster: rag, project: yt-lecture-rag, text: "A distance cutoff drops retrieved chunks that are too far from the query." }
  - { cluster: rag, project: yt-lecture-rag, text: "A title-word boost ranks a lecture higher when the query matches its title." }
  - { cluster: rag, project: yt-lecture-rag, text: "A small Groq model rewrites Hinglish questions into English DSA search queries." }
  - { cluster: rag, project: yt-lecture-rag, text: "Rewritten search queries are cached so a repeated question skips the LLM call." }
  - { cluster: rag, project: yt-lecture-rag, text: "Ask a DSA question in Hinglish or English and land on the exact lecture timestamp." }
  - { cluster: rag, project: yt-lecture-rag, text: "The English-only embedder matched Hinglish queries by language instead of by topic." }
  - { cluster: rag, project: yt-lecture-rag, text: "Query rewriting fixed the mismatch between Hinglish questions and English transcripts." }
  - { cluster: rag, project: yt-lecture-rag, text: "Embeddings run through fastembed with ONNX so lecture search fits on Vercel." }
  - { cluster: rag, project: yt-lecture-rag, text: "Vector search over transcript chunks returns the top five candidate moments." }
  - { cluster: rag, project: yt-lecture-rag, text: "Grounded answers are generated only from retrieved lecture excerpts." }
  - { cluster: rag, project: yt-lecture-rag, text: "Each grounded answer has to cite the lecture excerpt it draws from." }

  # ── evals ────────────────────────────────────────────────────────
  - { cluster: evals, project: yt-lecture-rag, text: "The retrieval eval uses a golden set of 20 questions plus 8 off-topic questions." }
  - { cluster: evals, project: yt-lecture-rag, text: "Query rewriting raised hit@5 from 65% to 95%." }
  - { cluster: evals, project: yt-lecture-rag, text: "Mean reciprocal rank rose from about 0.59 to 0.77 after query rewriting." }
  - { cluster: evals, project: yt-lecture-rag, text: "Top-1 accuracy went from about 55% to 65% with query rewriting." }
  - { cluster: evals, project: yt-lecture-rag, text: "All 8 off-topic questions in the golden set are refused." }
  - { cluster: evals, project: yt-lecture-rag, text: "Moving to fastembed ONNX left hit@5, top-1 and MRR unchanged." }
  - { cluster: evals, project: yt-lecture-rag, text: "Retrieval quality is measured with hit@k and MRR at k = 5." }
  - { cluster: evals, project: yt-lecture-rag, text: "The answer is refused when nothing survives the distance cutoff." }
  - { cluster: evals, project: yt-lecture-rag, text: "The answer is refused when the model says the excerpts don't cover the question." }
  - { cluster: evals, project: yt-lecture-rag, text: "The answer is refused when it has no valid citation." }
  - { cluster: evals, project: yt-lecture-rag, text: "Every setup is scored against the baseline on the same golden set." }
